<helmet>

body{margin:0;font-family:'Quicksand',system-ui,sans-serif;color:#1F2A22}
a{color:#2F5E3F}a:hover{color:#1F3F2A}

<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 12px; background: #E6DFD3; font-family: 'Quicksand', system-ui, sans-serif; color: #1F2A22">

<div style="flex-grow: 1; overflow: hidden; padding: 18px 18px 8px; display: flex; flex-direction: column; gap: 14px">

<div style="display: flex; flex-direction: column; gap: 2px">
<h1 style="margin: 0; font-size: 26px; font-weight: 700">Idées</h1>

<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5B6359" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>

</label>

<div style="display: flex; gap: 6px">
<button type="button" style="min-height: 36px; padding: 0 14px; border-radius: 999px; border: none; background: #1F2A22; color: #FFFFFF; font-family: inherit; font-size: 13px; font-weight: 700">Végétal</button>
<button type="button" style="min-height: 36px; padding: 0 14px; border-radius: 999px; border: 1.5px solid #E4DED3; background: #FFFFFF; color: #4D554B; font-family: inherit; font-size: 13px; font-weight: 600">Minéral</button>
<button type="button" style="min-height: 36px; padding: 0 14px; border-radius: 999px; border: 1.5px solid #E4DED3; background: #FFFFFF; color: #4D554B; font-family: inherit; font-size: 13px; font-weight: 600">Déco</button>
<button type="button" style="min-height: 36px; padding: 0 14px; border-radius: 999px; border: 1.5px solid #E4DED3; background: #FFFFFF; color: #4D554B; font-family: inherit; font-size: 13px; font-weight: 600">Ambiances</button>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 12px; font-weight: 700; letter-spacing: 1.2px; color: #5B6359">QUELLE AMBIANCE VOUS RESSEMBLE ?</span>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<a href="#" style="height: 84px; border-radius: 18px; background: #A97F4E; display: flex; align-items: flex-end; padding: 10px; box-sizing: border-box; color: #FFFFFF; text-decoration: none; font-size: 13px; font-weight: 700">Méditerranéen</a>
<a href="#" style="height: 84px; border-radius: 18px; background: #5E7A62; display: flex; align-items: flex-end; padding: 10px; box-sizing: border-box; color: #FFFFFF; text-decoration: none; font-size: 13px; font-weight: 700">Zen</a>
<a href="#" style="height: 84px; border-radius: 18px; background: #86689A; display: flex; align-items: flex-end; padding: 10px; box-sizing: border-box; color: #FFFFFF; text-decoration: none; font-size: 13px; font-weight: 700">Jardin anglais</a>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 12px; font-weight: 700; letter-spacing: 1.2px; color: #5B6359">PLANTES QUI ONT LA COTE</span>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<sc-for list="{{plants}}" as="p" hint-placeholder-count="4">
<div style="border-radius: 18px; overflow: hidden; border: 1.5px solid #EEE9E0; display: flex; flex-direction: column">
<div style="height: 86px; background: {{p.color}}; display: flex; justify-content: flex-end; align-items: flex-start; padding: 6px">
<button type="button" onClick="{{p.toggle}}" aria-label="{{p.label}}" style="width: 40px; height: 40px; border-radius: 999px; border: none; background: #FFFFFF; display: flex; align-items: center; justify-content: center">
<sc-if value="{{p.liked}}" hint-placeholder-val="{{ false }}">
<svg width="18" height="18" viewBox="0 0 24 24" fill="#C0652E" stroke="#C0652E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"></path></svg>
</sc-if>
<sc-if value="{{p.notLiked}}" hint-placeholder-val="{{ true }}">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4D554B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"></path></svg>
</sc-if>
</button>
</div>
<div style="padding: 8px 10px 10px; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 14px; font-weight: 700">{{p.name}}</span>
<span style="font-size: 12px; color: #5B6359">{{p.tags}}</span>
</div>

<a href="Ajout.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #2F5E3F; font-size: 12px; font-weight: 700"><span style="width: 56px; height: 56px; box-sizing: border-box; border-radius: 999px; background: #2F5E3F; border: 4px solid #FFFFFF; margin-top: -30px; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 16px rgba(47,94,63,0.35)"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></span>Ajouter</a>
<a href="#" style="display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 4px; min-height: 44px; text-decoration: none; color: #6B7268; font-size: 12px; font-weight: 600"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"></path></svg>Coups de cœur</a>

</nav>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { liked: { lavande: true } };
}
renderVals() {
const base = [
{ id: 'lavande', name: 'Lavande', tags: 'Soleil · Très facile', color: '#8C7AB0' },
{ id: 'olivier', name: 'Olivier', tags: 'Soleil · Sec', color: '#7E8F6A' },
{ id: 'agapanthe', name: 'Agapanthe', tags: 'Soleil · Facile', color: '#5F7BB0' },
{ id: 'graminees', name: 'Graminées', tags: 'Mi-ombre · Facile', color: '#A8925F' }
];
const liked = this.state.liked || {};
const plants = base.map((p) => {
const on = !!liked[p.id];
return Object.assign({}, p, {
liked: on,
notLiked: !on,
label: on ? 'Retirer ' + p.name + ' de mes coups de cœur' : 'Ajouter ' + p.name + ' à mes coups de cœur',
toggle: () => {
const next = Object.assign({}, this.state.liked || {});
next[p.id] = !next[p.id];
this.setState({ liked: next });
}
});
});
return { plants: plants };
}
}
</script>
</body>
</html>
